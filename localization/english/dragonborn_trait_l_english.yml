l_english:
 trait_dragonborn:0 "Dragon Born"
 trait_dragonborn_desc:0 "Dovahkiin are individuals with the body of a mortal, but the blood and soul of a Dragon.\n\nSome believe that Dragonborn appear in the world in times of great need by the command of the Gods.\n\nBy Nord tradition, a Dragonborn represents what a Nord should strive to be."
