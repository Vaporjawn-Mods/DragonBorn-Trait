l_english:
 trait_dragonborn:0 "Dragon Born"
 trait_dragonborn_desc:0 "Dovahkiin are individuals with the body of a mortal, but the blood and soul of a Dragon.\n\nSome believe that Dragonborn appear in the world in times of great need by the command of the Gods. By Nord tradition, a Dragonborn represents what a Nord should strive to be.\n\nA Dragonborn is exceptionally rare, a true warrior, leader and holy figure at once, and can #bold Speak the Thu'um#! to call on the power of their dragon soul."
 dragonborn_thuum_decision:0 "Speak the Thu'um"
 dragonborn_thuum_decision_desc:0 "The old words rise in my throat. When I shout, mountains remember the dragons."
 dragonborn_thuum_decision_tooltip:0 "Shout with the voice of a dragon. Spends piety and can only be used once every 5 years."
 dragonborn_thuum_decision_confirm:0 "Fus Ro Dah!"
 dragonborn_thuum_modifier:0 "Voice of the Dragon"
 dragonborn_thuum_modifier_desc:0 "The Thu'um still echoes through the realm. Your enemies hesitate to stand against the Dragonborn."
