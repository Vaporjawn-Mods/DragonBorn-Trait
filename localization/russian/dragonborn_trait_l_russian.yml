l_russian:
 trait_dragonborn:0 "Драконорожденный"
 trait_dragonborn_desc:0 "Довакины — люди с телом смертного, но с кровью и душой дракона.\n\nНекоторые верят, что драконорожденные появляются в мире в час великой нужды по воле богов. По обычаю нордов, драконорожденный воплощает то, к чему должен стремиться каждый норд.\n\nДраконорожденный исключительно редок: он одновременно воин, вождь и святой, и может #bold произнести Тум#!, чтобы призвать мощь своей драконьей души."
 dragonborn_thuum_decision:0 "Произнести Тум"
 dragonborn_thuum_decision_desc:0 "Древние слова поднимаются в моём горле. Когда я кричу, горы вспоминают драконов."
 dragonborn_thuum_decision_tooltip:0 "Крикните голосом дракона. Тратит благочестие и может применяться раз в 5 лет."
 dragonborn_thuum_decision_confirm:0 "Фус Ро Да!"
 dragonborn_thuum_modifier:0 "Голос дракона"
 dragonborn_thuum_modifier_desc:0 "Тум всё ещё отзывается эхом по всему королевству. Ваши враги не решаются выступить против драконорожденного."
